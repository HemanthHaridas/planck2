[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planck"
version = "0.1.0"
description = "Python package to perform Hartree-Fock and post-Hartree-Fock calculations on molecules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hemanth Haridas", email = "hemanthhari23@gmail.com" }
]

dependencies = [
    "numpy",  # List of runtime dependencies
    "scipy",
    "pymsym",
    "pybind11"
]
requires-python = ">=3.11"  # Minimum Python version

[tool.setuptools]
packages = [
    "src.basis", 
    "src.geometry", 
    "src.helpers", 
    "src.integrals", 
    "src.io", 
    "src.symmetry", 
    "src.calculators", 
    "src.calculators.hf", 
    "src.calculators.mp2", 
    "src.exceptions"
    ]  # Include subfolders as packages

[project.urls]
homepage = "https://github.com/HemanthHaridas/planck_v2"
repository = "https://github.com/HemanthHaridas/planck_v2"
documentation = "https://github.com/HemanthHaridas/planck_v2"